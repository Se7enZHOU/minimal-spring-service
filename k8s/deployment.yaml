apiVersion: apps/v1
kind: Deployment
metadata:
  name: minimal-spring-service
  labels:
    app.kubernetes.io/name: minimal-spring-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minimal-spring-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minimal-spring-service
    spec:
      containers:
        - name: app
          image: your-registry/minimal-spring-service:0.0.1-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: cloud
            - name: APP_MESSAGE
              value: Hello from your Kubernetes cluster
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
